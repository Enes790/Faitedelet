<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mini Blok 2D · Savaş</title>
<style>
:root{--bg:#87ceeb;box-sizing:border-box;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10182a}}
:root[data-theme="dark"]{--bg:#10182a}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#stick{position:fixed;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 40% 40%, rgba(255,255,255,.22), rgba(255,255,255,.1));border:2px solid rgba(255,255,255,.5);touch-action:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#knob{position:absolute;left:42px;top:42px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 35%, rgba(255,255,255,.9), rgba(200,200,200,.7));box-shadow:0 2px 8px rgba(0,0,0,.4), inset 0 -2px 4px rgba(0,0,0,.1);pointer-events:none}
.btn{position:fixed;border-radius:50%;background:radial-gradient(circle at 35% 35%, rgba(60,60,60,.55), rgba(0,0,0,.55));color:#fff;border:2px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;touch-action:none;text-align:center;line-height:1.1;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.btn:active{background:radial-gradient(circle at 35% 35%, rgba(255,255,255,.45), rgba(200,200,200,.3));transform:scale(.95)}
#jump{right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:84px;height:84px;font-size:15px}
#koy{right:calc(112px + env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:68px;height:68px;font-size:15px;background:radial-gradient(circle at 35% 35%, rgba(60,180,80,.7), rgba(30,120,40,.7))}
#craft{left:calc(10px + env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px));width:64px;height:46px;border-radius:10px;font-size:11px;z-index:2}
#act{right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(124px + env(safe-area-inset-bottom,0px));width:92px;height:92px;font-size:18px;background:radial-gradient(circle at 35% 35%, rgba(240,80,60,.7), rgba(180,40,20,.7))}
#at{right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(224px + env(safe-area-inset-bottom,0px));width:68px;height:68px;font-size:14px;background:radial-gradient(circle at 35% 35%, rgba(100,130,220,.7), rgba(50,70,160,.7))}
#bar{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:calc(78px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:3px;justify-content:center;z-index:2}
#hearts{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(60px + env(safe-area-inset-top,0px));display:flex;gap:2px;z-index:2;pointer-events:none}
.heart{width:22px;height:22px;font-size:22px;line-height:22px;text-align:center;filter:drop-shadow(0 0 2px #000)}
.heart.f{color:#e5333f}
.heart.e{color:#3b2c30}
.heart.h{background:linear-gradient(90deg,#e5333f 50%,#3b2c30 50%);-webkit-background-clip:text;background-clip:text;color:transparent}
.slot{position:relative;flex:1 1 0;max-width:46px;aspect-ratio:1;border:3px solid rgba(0,0,0,.6);box-sizing:border-box;background:linear-gradient(135deg, rgba(40,45,55,.5), rgba(20,25,35,.5));touch-action:none;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 8px rgba(0,0,0,.3)}
.slot.sel{border-color:#fff;background:linear-gradient(135deg, rgba(255,255,255,.35), rgba(200,200,200,.2));box-shadow:0 0 0 2px rgba(255,255,255,.5), inset 0 0 10px rgba(255,255,255,.2)}
.ic{width:70%;height:70%;box-sizing:border-box;border:2px solid rgba(0,0,0,.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15), inset 0 -3px 0 rgba(0,0,0,.2);font-style:normal;display:flex;align-items:center;justify-content:center;font-size:clamp(11px,2.6vw,18px);line-height:1;color:#fff;text-shadow:0 0 3px #000, 1px 1px 0 #000}
.n{position:absolute;right:2px;bottom:0;color:#fff;font-size:11px;font-weight:700;text-shadow:0 0 3px #000,0 0 3px #000,1px 1px 0 #000;pointer-events:none}
#selname{position:fixed;left:0;right:0;top:calc(60px + env(safe-area-inset-top,0px));text-align:center;color:#fff;font-size:13px;font-weight:700;text-shadow:0 0 4px #000,0 0 4px #000,1px 1px 0 #000;pointer-events:none;opacity:0;transition:opacity .4s;z-index:1}
#mhud{display:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(112px + env(safe-area-inset-top,0px));background:rgba(0,0,0,.7);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;pointer-events:none;white-space:nowrap;z-index:2;border:1px solid rgba(255,255,255,.2)}
#mbar{display:inline-block;vertical-align:middle;width:80px;height:6px;margin-left:8px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
#mfill{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23c,#ff8800)}
#hint{position:fixed;left:0;right:0;top:calc(140px + env(safe-area-inset-top,0px));text-align:center;color:#fff;font-size:13px;text-shadow:0 0 4px #000,0 0 4px #000;pointer-events:none;transition:opacity 1s;padding:0 16px}
#panel{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(96vw,480px);max-height:86vh;overflow:auto;touch-action:pan-y;background:linear-gradient(180deg, rgba(30,35,50,.97), rgba(18,20,30,.97));color:#fff;border:2px solid rgba(255,255,255,.4);border-radius:12px;padding:10px 12px;box-sizing:border-box;z-index:5;box-shadow:0 8px 32px rgba(0,0,0,.6)}
#panel h3{margin:6px 0;font-size:15px;display:flex;justify-content:space-between;align-items:center}
#panel u{text-decoration:none;padding:6px 12px;background:rgba(255,255,255,.2);border-radius:6px;font-size:12px;cursor:pointer}
.info{font-size:12px;opacity:.85;min-height:30px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.g9{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin:4px 0}
.cell{position:relative;aspect-ratio:1;border:2px solid rgba(255,255,255,.2);background:linear-gradient(135deg, rgba(255,255,255,.1), rgba(255,255,255,.04));display:flex;align-items:center;justify-content:center;touch-action:manipulation;box-sizing:border-box;box-shadow:inset 0 0 4px rgba(0,0,0,.3)}
.cell.sel{border-color:#fff}
.cell.mv{border-color:#ffd23c;background:rgba(255,210,60,.22)}
.sep{height:8px;border-bottom:1px solid rgba(255,255,255,.2);margin-bottom:6px}
.rc{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
.rc span{flex:1}
.ico{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;position:relative}
.ico .ic{width:100%;height:100%}
.rc button{padding:10px 12px;border-radius:6px;border:0;background:linear-gradient(180deg,#5fdc63,#3a963e);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.rc button.all{background:linear-gradient(180deg,#5aa0e8,#3a6fb0);margin-left:4px}
.rc .forge{color:#ffb060;font-size:10px}
</style></head><body>
<canvas id="c"></canvas>
<div id="bar"></div>
<div id="hearts"></div>
<div id="selname"></div>
<div id="mhud"><span id="mn"></span><span id="mbar"><i id="mfill"></i></span></div>
<div id="hint">KIR: kaz / vur. KOY: blok koy (Gübre çimene fidan diker). AT: top fırlat. Dikkat: İskeletler uzaktan ok atar!</div>
<div id="stick"><div id="knob"></div></div>
<div id="panel"></div>
<div class="btn" id="craft">ENVAN<br>TER</div>
<div class="btn" id="act">KIR</div>
<div class="btn" id="at">🎯 AT</div>
<div class="btn" id="koy">KOY</div>
<div class="btn" id="jump">ZIPLA</div>
<script src="state.js"></script>
<script src="world.js"></script>
<script src="items.js"></script>
<script src="ui.js"></script>
<script src="player.js"></script>
<script src="mobs.js"></script>
<script src="render.js"></script>
<script src="debug.js"></script>
<script src="game.js"></script>
</body></html>
