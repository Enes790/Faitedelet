<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6fb7e8">
<title>2D Minecraft · Envanter + Kömür</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0d1117;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select:none; }
  #game { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #ui { position:fixed; inset:0; pointer-events:none; }

  .pad { position:absolute; display:flex; gap:12px; pointer-events:auto; }
  #padMove { left:14px; bottom:calc(100px + env(safe-area-inset-bottom)); }
  #padJump { right:14px; bottom:calc(100px + env(safe-area-inset-bottom)); }
  .btn { width:64px; height:64px; border-radius:18px; border:2px solid rgba(255,255,255,.35);
    background:rgba(15,20,28,.45); color:#fff; font-size:26px; display:grid; place-items:center;
    touch-action:none; backdrop-filter:blur(6px); transition:transform .06s, background .1s; }
  .btn.on { background:rgba(255,255,255,.3); transform:scale(.94); }

  #hotbar { position:absolute; left:50%; transform:translateX(-50%);
    bottom:calc(14px + env(safe-area-inset-bottom)); display:flex; gap:5px; pointer-events:auto;
    padding:6px; border-radius:16px; background:rgba(10,14,20,.45);
    border:2px solid rgba(255,255,255,.18); backdrop-filter:blur(6px);
    max-width:calc(100vw - 12px); }
  .slot { width:36px; height:36px; flex-shrink:0; border-radius:9px; border:2px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.06); display:grid; place-items:center; font-size:18px;
    position:relative; touch-action:none; transition:.1s; overflow:hidden; }
  .slot.sel { border-color:#ffd84d; background:rgba(255,216,77,.14);
    box-shadow:0 0 0 2px rgba(255,216,77,.35), 0 0 14px rgba(255,216,77,.5); }
  .slot.tool-slot { border-color:rgba(255,255,255,.35); }
  .slot canvas { width:26px; height:26px; image-rendering:pixelated; border-radius:4px; }
  .slot.empty { opacity:0.4; }
  .slot .count { position:absolute; bottom:0px; right:3px; font-size:10px; font-weight:800;
    color:#fff; text-shadow:0 0 2px #000,1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;
    pointer-events:none; }
  .dur-bar { position:absolute; bottom:2px; left:3px; right:3px; height:3px;
    background:rgba(0,0,0,.6); border-radius:2px; overflow:hidden; }
  .dur-fill { height:100%; background:#4caf50; transition:width .1s, background .2s; }

  @media (max-width: 420px) {
    .slot { width:30px; height:30px; border-radius:7px; font-size:15px; }
    .slot canvas { width:22px; height:22px; }
    .slot .count { font-size:9px; }
    #hotbar { gap:3px; padding:4px; }
  }

  #hint { position:absolute; top:calc(10px + env(safe-area-inset-top)); left:50%;
    transform:translateX(-50%); color:#fff; font-size:11px; background:rgba(10,14,20,.45);
    padding:5px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.15);
    white-space:nowrap; backdrop-filter:blur(6px); transition:opacity .8s; }

  #toast { position:absolute; top:calc(70px + env(safe-area-inset-top)); left:50%;
    transform:translateX(-50%); color:#fff; font-size:12px;
    background:rgba(200,50,50,.9); padding:6px 14px; border-radius:999px;
    opacity:0; transition:opacity .25s; pointer-events:none; z-index:20; }
  #toast.show { opacity:1; }
  #toast.ok { background:rgba(76,175,80,.9); }

  .craft-btn { position:absolute; top:calc(10px + env(safe-area-inset-top)); right:12px;
    width:48px; height:48px; border-radius:14px; border:2px solid rgba(255,255,255,.3);
    background:rgba(15,20,28,.55); color:#fff; font-size:24px; pointer-events:auto;
    backdrop-filter:blur(6px); display:grid; place-items:center; }
  .craft-btn:active { transform:scale(.94); }

  #craftPanel { position:absolute; inset:0; background:rgba(8,12,18,.85);
    backdrop-filter:blur(8px); z-index:15; pointer-events:auto;
    display:flex; flex-direction:column; padding:calc(16px + env(safe-area-inset-top)) 16px
    calc(16px + env(safe-area-inset-bottom)); gap:14px; overflow-y:auto; }
  #craftPanel.hidden { display:none; }
  .craft-header { display:flex; justify-content:space-between; align-items:center;
    color:#fff; font-size:20px; font-weight:700; }
  .craft-close { width:40px; height:40px; border-radius:12px; border:2px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.08); color:#fff; font-size:18px; }
  .recipe-list { display:flex; flex-direction:column; gap:8px; }
  .recipe { background:rgba(40,50,65,.7); border:2px solid rgba(255,255,255,.1);
    border-radius:12px; padding:12px 16px; color:#fff; }
  .recipe.can { border-color:#4caf50; background:rgba(40,90,50,.7); cursor:pointer; }
  .recipe.can:active { transform:scale(.98); }
  .recipe.owned { opacity:0.4; }
  .recipe-name { font-weight:700; font-size:15px; margin-bottom:4px; }
  .recipe-ing { font-size:12.5px; opacity:0.9; line-height:1.4; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
  <div id="hint">◀ ▶ yürü · ⤒ zıpla · bloğa basılı tut → kır · boşluğa dokun → koy · ⚒️ craft</div>
  <div id="toast"></div>

  <button id="craftBtn" class="craft-btn">⚒️</button>

  <div class="pad" id="padMove">
    <div class="btn" id="btnLeft">◀</div>
    <div class="btn" id="btnRight">▶</div>
  </div>
  <div class="pad" id="padJump">
    <div class="btn" id="btnJump">⤒</div>
  </div>

  <div id="hotbar"></div>
</div>

<div id="craftPanel" class="hidden">
  <div class="craft-header">
    <span>⚒️ Craft</span>
    <button id="craftClose" class="craft-close">✕</button>
  </div>
  <div id="recipeList" class="recipe-list"></div>
</div>

<script>
(() => {
'use strict';

/* ================== SABİTLER ================== */
const TILE = 28;
const WORLD_W = 220;
const WORLD_H = 30;

const AIR = 0, GRASS = 1, DIRT = 2, STONE = 3, WOOD = 4, LEAF = 5, STICK = 6, COAL_ORE = 7, COAL = 8;

const BLOCK_INFO = {
  [GRASS]: { name: 'Çim',    hardness: 0.55, color: '#4f9e3a' },
  [DIRT]:  { name: 'Toprak', hardness: 0.55, color: '#7b5232' },
  [STONE]: { name: 'Taş',    hardness: 1.60, color: '#8b8f96' },
  [WOOD]:  { name: 'Odun',   hardness: 1.00, color: '#7d5328' },
  [LEAF]:  { name: 'Yaprak', hardness: 0.30, color: '#2f8b3f' },
  [COAL_ORE]: { name: 'Kömür Cevheri', hardness: 1.90, color: '#2a2a2a' },
};

const ITEM_INFO = {
  [STICK]: { name: 'Çubuk', color: '#a07850' },
  [COAL]:  { name: 'Kömür', color: '#1a1a1a' },
};

const PLACEABLE = new Set([GRASS, DIRT, STONE, WOOD, LEAF]);
const STACK_MAX = 64;

const SPEED = 195;
const JUMP = -365;
const GRAVITY = 1280;
const MAX_FALL = 700;

/* ================== CANVAS ================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
let cameraX = 0, cameraY = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth;
  VH = window.innerHeight;
  canvas.width  = Math.round(VW * DPR);
  canvas.height = Math.round(VH * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);

/* ================== DOKULAR ================== */
const TS = 32;

function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
}
function newTex() { const c = document.createElement('canvas'); c.width = c.height = TS; return c; }
function edgeShade(g, a = 0.10) {
  g.fillStyle = `rgba(0,0,0,${a})`;
  g.fillRect(0, 0, TS, 1); g.fillRect(0, TS - 1, TS, 1);
  g.fillRect(0, 0, 1, TS); g.fillRect(TS - 1, 0, 1, TS);
}

function texGrass() {
  const c = newTex(), g = c.getContext('2d'), r = rng(11);
  g.fillStyle = '#7b5232'; g.fillRect(0, 0, TS, TS);
  for (let i = 0; i < 110; i++) {
    const x = r() * TS | 0, y = r() * TS | 0, s = 1 + (r() * 3 | 0);
    g.fillStyle = r() < .5 ? 'rgba(0,0,0,.15)' : 'rgba(255,235,200,.09)';
    g.fillRect(x, y, s, s);
  }
  for (let x = 0; x < TS; x++) {
    const h = 7 + (r() * 6 | 0);
    g.fillStyle = '#4f9e3a'; g.fillRect(x, 0, 1, h);
    g.fillStyle = 'rgba(0,0,0,.16)'; g.fillRect(x, h, 1, 2);
  }
  for (let i = 0; i < 70; i++) {
    const x = r() * TS | 0, y = r() * 9 | 0;
    g.fillStyle = r() < .5 ? 'rgba(180,255,170,.20)' : 'rgba(0,0,0,.13)';
    g.fillRect(x, y, 2, 1);
  }
  edgeShade(g);
  return c;
}
function texDirt() {
  const c = newTex(), g = c.getContext('2d'), r = rng(23);
  g.fillStyle = '#7b5232'; g.fillRect(0, 0, TS, TS);
  for (let i = 0; i < 190; i++) {
    const x = r() * TS | 0, y = r() * TS | 0, s = 1 + (r() * 3 | 0);
    g.fillStyle = r() < .45 ? 'rgba(0,0,0,.17)' : (r() < .5 ? 'rgba(255,230,190,.10)' : 'rgba(120,70,40,.35)');
    g.fillRect(x, y, s, s);
  }
  for (let i = 0; i < 7; i++) {
    const x = r() * (TS - 6) | 0, y = r() * (TS - 6) | 0;
    g.fillStyle = 'rgba(0,0,0,.20)'; g.fillRect(x, y, 4, 3);
  }
  edgeShade(g);
  return c;
}
function texStone() {
  const c = newTex(), g = c.getContext('2d'), r = rng(37);
  g.fillStyle = '#8b8f96'; g.fillRect(0, 0, TS, TS);
  for (let i = 0; i < 200; i++) {
    const x = r() * TS | 0, y = r() * TS | 0, s = 1 + (r() * 4 | 0);
    g.fillStyle = r() < .5 ? 'rgba(0,0,0,.14)' : 'rgba(255,255,255,.14)';
    g.fillRect(x, y, s, s);
  }
  g.strokeStyle = 'rgba(0,0,0,.22)'; g.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    g.beginPath();
    let x = r() * TS | 0, y = r() * TS | 0;
    g.moveTo(x, y);
    for (let j = 0; j < 3; j++) { x += (r() * 12 | 0) - 6; y += (r() * 12 | 0) - 6; g.lineTo(x, y); }
    g.stroke();
  }
  edgeShade(g, 0.12);
  return c;
}
function texCoalOre() {
  const c = newTex(), g = c.getContext('2d'), r = rng(91);
  g.fillStyle = '#8b8f96'; g.fillRect(0, 0, TS, TS);
  for (let i = 0; i < 150; i++) {
    const x = r() * TS | 0, y = r() * TS | 0, s = 1 + (r() * 3 | 0);
    g.fillStyle = r() < .5 ? 'rgba(0,0,0,.14)' : 'rgba(255,255,255,.14)';
    g.fillRect(x, y, s, s);
  }
  for (let i = 0; i < 9; i++) {
    const x = 4 + (r() * (TS - 14) | 0);
    const y = 4 + (r() * (TS - 14) | 0);
    const sz = 4 + (r() * 5 | 0);
    g.fillStyle = '#141414';
    g.fillRect(x, y, sz, sz);
    g.fillStyle = '#2a2a2a';
    g.fillRect(x + 1, y + 1, sz - 2, Math.max(1, sz - 3));
    g.fillStyle = '#404040';
    g.fillRect(x + 1, y + 1, 2, 2);
  }
  edgeShade(g, 0.14);
  return c;
}
function texWood() {
  const c = newTex(), g = c.getContext('2d'), r = rng(53);
  g.fillStyle = '#7d5328'; g.fillRect(0, 0, TS, TS);
  for (let i = 0; i < 9; i++) {
    const x = r() * TS | 0;
    g.fillStyle = 'rgba(0,0,0,.17)';
    g.fillRect(x, 0, 1 + (r() * 2 | 0), TS);
  }
  for (let i = 0; i < 45; i++) {
    const x = r() * TS | 0, y = r() * TS | 0;
    g.fillStyle = r() < .5 ? 'rgba(0,0,0,.12)' : 'rgba(255,220,170,.11)';
    g.fillRect(x, y, 2, 2);
  }
  g.fillStyle = 'rgba(60,35,15,.55)';
  g.fillRect(0, 0, 2, TS); g.fillRect(TS - 2, 0, 2, TS);
  return c;
}
function texLeaf() {
  const c = newTex(), g = c.getContext('2d'), r = rng(71);
  g.fillStyle = '#2f8b3f'; g.fillRect(0, 0, TS, TS);
  for (let i = 0; i < 230; i++) {
    const x = r() * TS | 0, y = r() * TS | 0, s = 1 + (r() * 3 | 0);
    g.fillStyle = r() < .5 ? 'rgba(0,0,0,.21)' : 'rgba(160,255,170,.24)';
    g.fillRect(x, y, s, s);
  }
  for (let i = 0; i < 12; i++) {
    const x = r() * TS | 0, y = r() * TS | 0;
    g.fillStyle = 'rgba(0,0,0,.26)'; g.fillRect(x, y, 2, 3);
  }
  edgeShade(g, 0.08);
  return c;
}
function texStick() {
  const c = newTex(), g = c.getContext('2d');
  g.fillStyle = '#a07850';
  g.fillRect(13, 6, 6, 20);
  g.fillStyle = '#7a5838';
  g.fillRect(13, 6, 6, 3);
  g.fillRect(13, 23, 6, 3);
  return c;
}
function texCoal() {
  const c = newTex(), g = c.getContext('2d');
  g.fillStyle = '#141414';
  g.beginPath();
  g.moveTo(8, 12); g.lineTo(22, 8); g.lineTo(26, 18); g.lineTo(22, 26); g.lineTo(10, 24); g.lineTo(6, 18);
  g.closePath(); g.fill();
  g.fillStyle = '#2a2a2a';
  g.fillRect(12, 12, 6, 4);
  g.fillRect(16, 17, 5, 4);
  g.fillStyle = '#4a4a4a';
  g.fillRect(10, 16, 3, 3);
  return c;
}

const TEX = {
  [GRASS]: texGrass(),
  [DIRT]:  texDirt(),
  [STONE]: texStone(),
  [COAL_ORE]: texCoalOre(),
  [WOOD]:  texWood(),
  [LEAF]:  texLeaf(),
  [STICK]: texStick(),
  [COAL]:  texCoal(),
};

function makeCracks() {
  const arr = [];
  for (let s = 1; s <= 4; s++) {
    const c = newTex(), g = c.getContext('2d'), r = rng(900 + s * 17);
    g.strokeStyle = 'rgba(0,0,0,.6)'; g.lineWidth = 1.5; g.lineCap = 'round';
    const lines = s * 4;
    for (let i = 0; i < lines; i++) {
      g.beginPath();
      let x = r() * TS | 0, y = r() * TS | 0;
      g.moveTo(x, y);
      const steps = 2 + (r() * 3 | 0);
      for (let j = 0; j < steps; j++) {
        x += (r() * 14 | 0) - 7; y += (r() * 14 | 0) - 7;
        g.lineTo(x, y);
      }
      g.stroke();
    }
    g.fillStyle = `rgba(0,0,0,${s * 0.05})`;
    g.fillRect(0, 0, TS, TS);
    arr.push(c);
  }
  return arr;
}
const CRACK = makeCracks();

/* ================== DÜNYA ================== */
const world   = [];
const bgWorld = [];
for (let y = 0; y < WORLD_H; y++) {
  world.push(new Array(WORLD_W).fill(AIR));
  bgWorld.push(new Array(WORLD_W).fill(AIR));
}

function generateWorld() {
  const baseY = 18;
  for (let x = 0; x < WORLD_W; x++) {
    let h = baseY + Math.round(Math.sin(x * 0.18) * 1.4 + Math.sin(x * 0.045) * 2.2);
    h = Math.max(12, Math.min(24, h));
    for (let y = h; y < WORLD_H; y++) {
      if (y === h) world[y][x] = GRASS;
      else if (y < h + 4) world[y][x] = DIRT;
      else world[y][x] = STONE;
    }
  }

  // Kömür cevheri damarları
  for (let i = 0; i < 65; i++) {
    const startX = Math.floor(Math.random() * WORLD_W);
    let startY = 21 + Math.floor(Math.random() * (WORLD_H - 21));
    let x = startX, y = startY;
    const size = 3 + Math.floor(Math.random() * 4);
    for (let j = 0; j < size; j++) {
      if (x >= 0 && x < WORLD_W && y >= 0 && y < WORLD_H && world[y][x] === STONE) {
        world[y][x] = COAL_ORE;
      }
      x += Math.floor(Math.random() * 3) - 1;
      y += Math.floor(Math.random() * 3) - 1;
    }
  }

  // Ağaçlar → arka plan
  for (let x = 6; x < WORLD_W - 6; x += 11) {
    if ((x * 7919) % 5 < 2) continue;
    let gy = -1;
    for (let y = 0; y < WORLD_H; y++) { if (world[y][x] !== AIR) { gy = y; break; } }
    if (gy <= 0 || world[gy][x] !== GRASS) continue;

    const trunk = 4 + ((x * 13) % 3);
    for (let i = 1; i <= trunk; i++) if (gy - i >= 0) bgWorld[gy - i][x] = WOOD;

    const top = gy - trunk;
    for (let dy = -2; dy <= 1; dy++) {
      for (let dx = -2; dx <= 2; dx++) {
        if (Math.abs(dx) === 2 && dy >= 0) continue;
        const tx = x + dx, ty = top + dy;
        if (tx >= 0 && tx < WORLD_W && ty >= 0 && ty < WORLD_H &&
            world[ty][tx] === AIR && bgWorld[ty][tx] === AIR)
          bgWorld[ty][tx] = LEAF;
      }
    }
    if (top - 1 >= 0 && world[top - 1][x] === AIR && bgWorld[top - 1][x] === AIR)
      bgWorld[top - 1][x] = LEAF;
  }
}
generateWorld();

/* ================== ALETLER & HOTBAR VERİSİ ================== */
const tools = {
  wood_pick:  { have: false, dur: 0, max: 40 },
  stone_pick: { have: false, dur: 0, max: 60 },
};

const hotbarData = {
  tools: [
    { name: 'Yumruk',      icon: '✊', speed: 1.0, infinite: true },
    { name: 'Tahta Kazma', icon: '⛏️', speed: 1.8, key: 'wood_pick' },
    { name: 'Taş Kazma',   icon: '⛏️', speed: 2.6, key: 'stone_pick' },
  ],
  // Dinamik envanter: her eleman null veya { itemId, count }
  items: [null, null, null, null, null],
};

/* ================== OYUNCU ================== */
const player = { x: 0, y: 0, w: 20, h: 38, vx: 0, vy: 0, onGround: false, walk: 0 };

function spawnPlayer() {
  const px = Math.floor(WORLD_W / 2);
  for (let y = 0; y < WORLD_H; y++) {
    if (world[y][px] !== AIR) {
      player.x = px * TILE + (TILE - player.w) / 2;
      player.y = y * TILE - player.h - 1;
      return;
    }
  }
  player.x = px * TILE;
  player.y = 0;
}
spawnPlayer();

/* ================== ENVANTER YARDIMCILARI ================== */
function countItem(itemId) {
  let total = 0;
  for (const s of hotbarData.items) {
    if (s && s.itemId === itemId) total += s.count;
  }
  return total;
}

function addItem(itemId, amount) {
  // 1. Aynı eşyadan varsa üstüne ekle
  for (let i = 0; i < hotbarData.items.length; i++) {
    const s = hotbarData.items[i];
    if (s && s.itemId === itemId && s.count < STACK_MAX) {
      const space = STACK_MAX - s.count;
      const add = Math.min(space, amount);
      s.count += add;
      amount -= add;
      if (amount <= 0) { renderAllSlots(); return true; }
    }
  }
  // 2. En soldaki boş kutuya koy
  for (let i = 0; i < hotbarData.items.length; i++) {
    if (!hotbarData.items[i]) {
      const add = Math.min(STACK_MAX, amount);
      hotbarData.items[i] = { itemId, count: add };
      amount -= add;
      if (amount <= 0) { renderAllSlots(); return true; }
    }
  }
  renderAllSlots();
  return amount <= 0;
}

function removeItem(itemId, amount) {
  for (let i = 0; i < hotbarData.items.length && amount > 0; i++) {
    const s = hotbarData.items[i];
    if (s && s.itemId === itemId) {
      const take = Math.min(s.count, amount);
      s.count -= take;
      amount -= take;
      if (s.count <= 0) hotbarData.items[i] = null;
    }
  }
  renderAllSlots();
  return amount === 0;
}

function getItemName(itemId) {
  return (BLOCK_INFO[itemId] && BLOCK_INFO[itemId].name) ||
         (ITEM_INFO[itemId] && ITEM_INFO[itemId].name) || '?';
}

/* ================== HOTBAR RENDER ================== */
const hotbarEl = document.getElementById('hotbar');
const slotEls = [];
const TOTAL_SLOTS = 8;

for (let i = 0; i < TOTAL_SLOTS; i++) {
  const el = document.createElement('div');
  el.className = 'slot';
  if (i < 3) el.classList.add('tool-slot');
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    selectSlot(i);
  });
  hotbarEl.appendChild(el);
  slotEls.push(el);
}

function renderSlot(i) {
  const el = slotEls[i];
  el.innerHTML = '';
  el.className = 'slot' + (i < 3 ? ' tool-slot' : '') + (i === state.selected ? ' sel' : '');

  if (i < 3) {
    const tool = hotbarData.tools[i];
    el.textContent = tool.icon;
    if (!tool.infinite) {
      const t = tools[tool.key];
      if (!t.have) {
        el.classList.add('empty');
      } else {
        const bar = document.createElement('div');
        bar.className = 'dur-bar';
        const fill = document.createElement('div');
        fill.className = 'dur-fill';
        const pct = (t.dur / t.max) * 100;
        fill.style.width = pct + '%';
        fill.style.background = pct > 30 ? '#4caf50' : '#e74c3c';
        bar.appendChild(fill);
        el.appendChild(bar);
      }
    }
  } else {
    const item = hotbarData.items[i - 3];
    if (!item) {
      el.classList.add('empty');
    } else {
      const cv = document.createElement('canvas');
      cv.width = TS; cv.height = TS;
      const tex = TEX[item.itemId];
      if (tex) cv.getContext('2d').drawImage(tex, 0, 0);
      el.appendChild(cv);
      const cnt = document.createElement('span');
      cnt.className = 'count';
      cnt.textContent = item.count;
      el.appendChild(cnt);
    }
  }
}

function renderAllSlots() {
  for (let i = 0; i < TOTAL_SLOTS; i++) renderSlot(i);
}

function selectSlot(i) {
  state.selected = i;
  state.mining = null;
  renderAllSlots();
}

/* ================== TOAST ================== */
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function showToast(msg, ok) {
  toastEl.textContent = msg;
  toastEl.classList.toggle('ok', !!ok);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1100);
}

/* ================== CRAFT ================== */
const RECIPES = [
  {
    name: 'Çubuk x4',
    ingredients: [[WOOD, 1]],
    canCraft() { return countItem(WOOD) >= 1; },
    craft() { removeItem(WOOD, 1); addItem(STICK, 4); }
  },
  {
    name: 'Tahta Kazma',
    ingredients: [[WOOD, 3], [STICK, 2]],
    isOwned() { return tools.wood_pick.have; },
    canCraft() {
      if (tools.wood_pick.have) return false;
      return countItem(WOOD) >= 3 && countItem(STICK) >= 2;
    },
    craft() {
      removeItem(WOOD, 3);
      removeItem(STICK, 2);
      tools.wood_pick = { have: true, dur: 40, max: 40 };
      renderAllSlots();
    }
  },
  {
    name: 'Taş Kazma',
    ingredients: [[STONE, 3], [STICK, 2]],
    isOwned() { return tools.stone_pick.have; },
    canCraft() {
      if (tools.stone_pick.have) return false;
      return countItem(STONE) >= 3 && countItem(STICK) >= 2;
    },
    craft() {
      removeItem(STONE, 3);
      removeItem(STICK, 2);
      tools.stone_pick = { have: true, dur: 60, max: 60 };
      renderAllSlots();
    }
  },
];

const craftPanel = document.getElementById('craftPanel');
const recipeList  = document.getElementById('recipeList');

function renderRecipes() {
  recipeList.innerHTML = '';
  RECIPES.forEach(r => {
    const owned = r.isOwned && r.isOwned();
    const can   = !owned && r.canCraft();

    const el = document.createElement('div');
    el.className = 'recipe' + (can ? ' can' : '') + (owned ? ' owned' : '');

    const nameEl = document.createElement('div');
    nameEl.className = 'recipe-name';
    nameEl.textContent = r.name + (owned ? ' ✓ (sende)' : '');
    el.appendChild(nameEl);

    const ingEl = document.createElement('div');
    ingEl.className = 'recipe-ing';
    ingEl.textContent = r.ingredients.map(([item, qty]) => {
      const have = countItem(item);
      return `${getItemName(item)} ${have}/${qty}`;
    }).join(' · ');
    el.appendChild(ingEl);

    if (can) {
      el.addEventListener('click', () => {
        r.craft();
        showToast(r.name + ' yapıldı!', true);
        renderRecipes();
      });
    }

    recipeList.appendChild(el);
  });
}

document.getElementById('craftBtn').addEventListener('click', () => {
  state.mining = null;
  state.pointerDown = false;
  renderRecipes();
  craftPanel.classList.remove('hidden');
});
document.getElementById('craftClose').addEventListener('click', () => {
  craftPanel.classList.add('hidden');
});

/* ================== GİRDİ DURUMU ================== */
const keys = { left: false, right: false, jump: false };
const state = {
  selected: 0,
  mining: null,
  pointerDown: false,
  particles: [],
};

/* ================== KLAVYE ================== */
function bindHold(el, on, off) {
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); el.classList.add('on'); on(); });
  const end = () => { el.classList.remove('on'); off(); };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('pointerleave', end);
}
bindHold(document.getElementById('btnLeft'),  () => keys.left = true,  () => keys.left = false);
bindHold(document.getElementById('btnRight'), () => keys.right = true, () => keys.right = false);
bindHold(document.getElementById('btnJump'),  () => keys.jump = true,  () => keys.jump = false);

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'a' || k === 'arrowleft')  keys.left = true;
  if (k === 'd' || k === 'arrowright') keys.right = true;
  if (k === ' ' || k === 'w' || k === 'arrowup') { keys.jump = true; e.preventDefault(); }
  if (k === 'c') document.getElementById('craftBtn').click();
  if (k >= '1' && k <= '8') selectSlot(parseInt(k) - 1);
});
window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'a' || k === 'arrowleft')  keys.left = false;
  if (k === 'd' || k === 'arrowright') keys.right = false;
  if (k === ' ' || k === 'w' || k === 'arrowup') keys.jump = false;
});

/* ================== DOKUNMATİK ================== */
function screenToWorld(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return { wx: clientX - r.left + cameraX, wy: clientY - r.top + cameraY };
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  state.pointerDown = true;
  handlePointer(e, true);
});
canvas.addEventListener('pointermove', (e) => {
  if (!state.pointerDown) return;
  handlePointer(e, false);
});
const endPointer = () => { state.pointerDown = false; state.mining = null; };
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

function canReach(tx, ty) {
  const pcx = player.x + player.w / 2, pcy = player.y + player.h / 2;
  const bcx = tx * TILE + TILE / 2,   bcy = ty * TILE + TILE / 2;
  const dx = pcx - bcx, dy = pcy - bcy;
  const max = TILE * 4.5;
  return dx * dx + dy * dy < max * max;
}
function overlapsPlayer(tx, ty) {
  const bx = tx * TILE, by = ty * TILE;
  return bx < player.x + player.w && bx + TILE > player.x &&
         by < player.y + player.h && by + TILE > player.y;
}

function getSelectedItem() {
  if (state.selected < 3) return null;
  return hotbarData.items[state.selected - 3];
}

function getMiningSpeed() {
  if (state.selected < 3) {
    const tool = hotbarData.tools[state.selected];
    if (tool.infinite) return tool.speed;
    const t = tools[tool.key];
    if (!t.have) return 1.0;
    return tool.speed;
  }
  return 1.0;
}

function handlePointer(e, isDown) {
  const p = screenToWorld(e.clientX, e.clientY);
  const tx = Math.floor(p.wx / TILE);
  const ty = Math.floor(p.wy / TILE);
  if (tx < 0 || tx >= WORLD_W || ty < 0 || ty >= WORLD_H) return;

  const fg = world[ty][tx];
  const bg = bgWorld[ty][tx];

  if (fg !== AIR || bg !== AIR) {
    if (!canReach(tx, ty)) { state.mining = null; return; }
    const layer = fg !== AIR ? 'fg' : 'bg';
    if (state.mining &&
        state.mining.tx === tx &&
        state.mining.ty === ty &&
        state.mining.layer === layer) return;
    state.mining = { tx, ty, layer, progress: 0 };
  } else {
    state.mining = null;
    if (isDown) {
      const item = getSelectedItem();
      if (!item) return;
      if (!PLACEABLE.has(item.itemId)) {
        showToast(getItemName(item.itemId) + ' yerleştirilemez');
        return;
      }
      if (!canReach(tx, ty) || overlapsPlayer(tx, ty)) return;

      world[ty][tx] = item.itemId;
      item.count--;
      if (item.count <= 0) hotbarData.items[state.selected - 3] = null;
      renderAllSlots();
      spawnParticles(tx, ty, item.itemId, 0.6);
    }
  }
}

/* ================== FİZİK ================== */
function isSolid(tx, ty) {
  if (tx < 0 || tx >= WORLD_W) return true;
  if (ty >= WORLD_H) return true;
  if (ty < 0) return false;
  return world[ty][tx] !== AIR;
}

function resolveX() {
  const left   = Math.floor(player.x / TILE);
  const right  = Math.floor((player.x + player.w - 1) / TILE);
  const top    = Math.floor(player.y / TILE);
  const bottom = Math.floor((player.y + player.h - 1) / TILE);
  for (let ty = top; ty <= bottom; ty++) {
    for (let tx = left; tx <= right; tx++) {
      if (isSolid(tx, ty)) {
        if (player.vx > 0) player.x = tx * TILE - player.w;
        else if (player.vx < 0) player.x = (tx + 1) * TILE;
        player.vx = 0;
        return;
      }
    }
  }
}
function resolveY() {
  const left   = Math.floor(player.x / TILE);
  const right  = Math.floor((player.x + player.w - 1) / TILE);
  const top    = Math.floor(player.y / TILE);
  const bottom = Math.floor((player.y + player.h - 1) / TILE);
  for (let ty = top; ty <= bottom; ty++) {
    for (let tx = left; tx <= right; tx++) {
      if (isSolid(tx, ty)) {
        if (player.vy > 0) { player.y = ty * TILE - player.h; player.onGround = true; }
        else if (player.vy < 0) { player.y = (ty + 1) * TILE; }
        player.vy = 0;
        return;
      }
    }
  }
}

/* ================== KIRMA / TOPLAMA ================== */
function spawnParticles(tx, ty, block, strength) {
  const color = (BLOCK_INFO[block] && BLOCK_INFO[block].color) || '#999';
  const count = Math.round(10 * strength) + 3;
  for (let i = 0; i < count; i++) {
    state.particles.push({
      x: tx * TILE + Math.random() * TILE,
      y: ty * TILE + Math.random() * TILE,
      vx: (Math.random() - 0.5) * 150,
      vy: -Math.random() * 170 - 30,
      life: 0.45 + Math.random() * 0.45,
      max: 0.9,
      size: 2 + Math.random() * 3,
      color,
    });
  }
}

function breakBlock(tx, ty, layer) {
  let block;
  if (layer === 'fg') {
    block = world[ty][tx];
    if (block === AIR) return;
  } else {
    block = bgWorld[ty][tx];
    if (block === AIR) return;
  }

  const dropItem = block === COAL_ORE ? COAL : block;

  if (!addItem(dropItem, 1)) {
    showToast('Envanter dolu!');
    return;
  }

  if (layer === 'fg') world[ty][tx] = AIR;
  else bgWorld[ty][tx] = AIR;

  spawnParticles(tx, ty, block, layer === 'fg' ? 1.0 : 0.7);
  damageTool();
}

function damageTool() {
  if (state.selected >= 3) return;
  const tool = hotbarData.tools[state.selected];
  if (tool.infinite) return;
  const t = tools[tool.key];
  if (!t.have) return;
  t.dur--;
  if (t.dur <= 0) {
    t.have = false;
    t.dur = 0;
    showToast(tool.name + ' kırıldı!');
  }
  renderAllSlots();
}

function updateMining(dt) {
  if (!state.pointerDown || !state.mining) return;
  const { tx, ty, layer } = state.mining;
  const block = layer === 'fg' ? world[ty][tx] : bgWorld[ty][tx];
  if (block === AIR) { state.mining = null; return; }

  const info = BLOCK_INFO[block];
  if (!info) { state.mining = null; return; }
  const speed = getMiningSpeed();

  state.mining.progress += (dt * speed) / info.hardness;
  if (state.mining.progress >= 1) {
    breakBlock(tx, ty, layer);
    state.mining = null;
  }
}

/* ================== GÜNCELLEME ================== */
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

function update(dt) {
  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  player.vx = dir * SPEED;
  if (dir !== 0) player.walk += dt * 11;

  if (keys.jump && player.onGround) {
    player.vy = JUMP;
    player.onGround = false;
  }

  player.vy += GRAVITY * dt;
  if (player.vy > MAX_FALL) player.vy = MAX_FALL;

  player.x += player.vx * dt;
  resolveX();

  player.onGround = false;
  player.y += player.vy * dt;
  resolveY();

  if (player.x < 0) player.x = 0;
  if (player.x + player.w > WORLD_W * TILE) player.x = WORLD_W * TILE - player.w;
  if (player.y > WORLD_H * TILE + 300) spawnPlayer();

  updateMining(dt);

  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.vy += 900 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) state.particles.splice(i, 1);
  }

  const targetX = player.x + player.w / 2 - VW / 2;
  const targetY = player.y + player.h / 2 - VH * 0.55;
  const smooth = Math.min(1, dt * 11);
  cameraX += (targetX - cameraX) * smooth;
  cameraY += (targetY - cameraY) * smooth;
  cameraX = clamp(cameraX, 0, Math.max(0, WORLD_W * TILE - VW));
  cameraY = clamp(cameraY, 0, Math.max(0, WORLD_H * TILE - VH));
}

/* ================== ÇİZİM ================== */
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#6fb7e8');
  g.addColorStop(1, '#c8e7f7');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);

  const sx = VW - 70, sy = 70 - cameraY * 0.08;
  ctx.fillStyle = 'rgba(255,246,180,.95)';
  ctx.beginPath(); ctx.arc(sx, sy, 26, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,246,180,.22)';
  ctx.beginPath(); ctx.arc(sx, sy, 44, 0, Math.PI * 2); ctx.fill();
}

function drawWorld() {
  const x0 = Math.max(0, Math.floor(cameraX / TILE));
  const x1 = Math.min(WORLD_W - 1, Math.ceil((cameraX + VW) / TILE));
  const y0 = Math.max(0, Math.floor(cameraY / TILE));
  const y1 = Math.min(WORLD_H - 1, Math.ceil((cameraY + VH) / TILE));

  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      const b = bgWorld[ty][tx];
      if (b === AIR) continue;
      const sx = Math.round(tx * TILE - cameraX);
      const sy = Math.round(ty * TILE - cameraY);
      ctx.drawImage(TEX[b], sx, sy, TILE, TILE);
      ctx.fillStyle = 'rgba(20, 25, 45, 0.55)';
      ctx.fillRect(sx, sy, TILE, TILE);
    }
  }

  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      const b = world[ty][tx];
      if (b === AIR) continue;
      const sx = Math.round(tx * TILE - cameraX);
      const sy = Math.round(ty * TILE - cameraY);
      ctx.drawImage(TEX[b], sx, sy, TILE, TILE);
    }
  }
}

function drawPlayer() {
  const px = Math.round(player.x - cameraX);
  const py = Math.round(player.y - cameraY);
  const swing = Math.sin(player.walk) * 2;

  ctx.fillStyle = '#2b3f6b';
  ctx.fillRect(px + 2, py + 26, 7, 12 + swing * 0.4);
  ctx.fillRect(px + 11, py + 26, 7, 12 - swing * 0.4);

  ctx.fillStyle = '#2e8bc0';
  ctx.fillRect(px + 1, py + 14, 18, 14);
  ctx.fillRect(px - 1, py + 15 + swing, 3, 9);
  ctx.fillRect(px + 18, py + 15 - swing, 3, 9);

  ctx.fillStyle = '#f0c090';
  ctx.fillRect(px - 1, py + 23 + swing, 3, 4);
  ctx.fillRect(px + 18, py + 23 - swing, 3, 4);
  ctx.fillRect(px + 1, py + 1, 18, 13);

  ctx.fillStyle = '#4a3320';
  ctx.fillRect(px + 1, py + 1, 18, 4);

  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(px + 5, py + 7, 3, 3);
  ctx.fillRect(px + 12, py + 7, 3, 3);

  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.fillRect(px + 8, py + 11, 4, 1);
}

function drawMiningOverlay() {
  if (!state.mining) return;
  const { tx, ty, progress, layer } = state.mining;
  const sx = Math.round(tx * TILE - cameraX);
  const sy = Math.round(ty * TILE - cameraY);

  if (layer === 'bg') {
    ctx.strokeStyle = 'rgba(255,220,120,.75)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 3]);
    ctx.strokeRect(sx + 1, sy + 1, TILE - 2, TILE - 2);
    ctx.setLineDash([]);
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx + 1, sy + 1, TILE - 2, TILE - 2);
  }

  const stage = Math.min(3, Math.floor(progress * 4));
  ctx.drawImage(CRACK[stage], sx, sy, TILE, TILE);
}

function drawParticles() {
  for (const p of state.particles) {
    const a = Math.max(0, Math.min(1, p.life / p.max));
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    const sx = Math.round(p.x - cameraX);
    const sy = Math.round(p.y - cameraY);
    ctx.fillRect(sx, sy, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function render() {
  drawSky();
  drawWorld();
  drawMiningOverlay();
  drawPlayer();
  drawParticles();
}

/* ================== BAŞLAT ================== */
renderAllSlots();
selectSlot(0);

let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

resize();
requestAnimationFrame(loop);

setTimeout(() => {
  const h = document.getElementById('hint');
  if (h) h.style.opacity = '0.35';
}, 8000);

})();
</script>
